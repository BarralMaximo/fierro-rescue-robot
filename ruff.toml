# Lint del repo: el CI corre `ruff check`. El formato no se chequea: es el compacto del equipo, sin largo de línea fijo.
target-version = "py310"  # el Python de ROS 2 Humble (Ubuntu 22.04)

[lint]
select = ["E", "F", "W605", "B", "UP"]
ignore = [
    "E501",  # largo de línea
    "E701",  # if x: return y en una línea
    "E702",  # dos instrucciones en una línea, con ;
    "E731",  # lambdas cortas asignadas a un nombre
    "B905",  # zip(strict=...): agregarlo cambiaría el comportamiento
]

[lint.per-file-ignores]
"test/*" = ["E402"]  # pytest.importorskip('rclpy') va antes de los imports que necesitan ROS
